<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Canopy</title>
  <meta name="description" content="The Canopy — coming soon.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <style>
    :root {
      --bg: #f4f1e8;
      --fg: #1f2d24;
      --muted: #5f6f63;
      --accent: #2f6b46;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101812;
        --fg: #e6ebe3;
        --muted: #8fa093;
        --accent: #7fc79a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      text-align: center;
    }
    svg { width: 72px; height: 72px; color: var(--accent); }
    h1 {
      margin: 20px 0 8px;
      font-size: clamp(2.25rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M32 58V34"/>
      <path d="M32 44c-4-1-8-4-9-8"/>
      <path d="M32 40c4-1 7-3 8-7"/>
      <path d="M12 30c0-12 9-22 20-22s20 10 20 22c0 3-3 5-6 4-2 3-6 4-9 2-3 3-8 3-11 0-3 2-7 1-9-2-3 1-5-1-5-4z"/>
    </svg>
    <h1>The Canopy</h1>
    <p>Something is growing here.</p>
  </main>
</body>
</html>
